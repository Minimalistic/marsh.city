<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="RadioGridXL">
  <!-- Solid square background so the icon is opaque + maskable (safe zone is the inner circle, radius 40). -->
  <rect width="100" height="100" fill="#0d0d1a"/>
  <!-- The header mark (PROFILE.logoSvg): a tile R in one blue.
       Scaled to 1.3 about the centre: the corner tiles reach 30.05 from it, so 39.07 here, inside the safe zone.
       make-icons.mjs draws the PNG icons from this file; run it after any change here. -->
  <g transform="translate(50 50) scale(1.3) translate(-50 -50)">
    <rect fill="#58c6f8" x="28.75" y="28.75" width="9.5" height="9.5" rx="2.6"/><rect fill="#58c6f8" x="39.75" y="28.75" width="9.5" height="9.5" rx="2.6"/><rect fill="#58c6f8" x="50.75" y="28.75" width="9.5" height="9.5" rx="2.6"/><rect fill="#58c6f8" x="28.75" y="39.75" width="9.5" height="9.5" rx="2.6"/><rect fill="#58c6f8" x="61.75" y="39.75" width="9.5" height="9.5" rx="2.6"/><rect fill="#58c6f8" x="28.75" y="50.75" width="9.5" height="9.5" rx="2.6"/><rect fill="#58c6f8" x="39.75" y="50.75" width="9.5" height="9.5" rx="2.6"/><rect fill="#58c6f8" x="50.75" y="50.75" width="9.5" height="9.5" rx="2.6"/><rect fill="#58c6f8" x="28.75" y="61.75" width="9.5" height="9.5" rx="2.6"/><rect fill="#58c6f8" x="61.75" y="61.75" width="9.5" height="9.5" rx="2.6"/>
  </g>
</svg>
