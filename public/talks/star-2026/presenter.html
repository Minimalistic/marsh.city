<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>STAR talk: presenter view</title>
<style>
  :root { --bg: #1f1a14; --fg: #fbf8f1; --dim: #b9ad9c; --accent: #e08a5f; --panel: #2a241c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
  button { font: inherit; background: var(--panel); color: var(--fg); border: 1px solid var(--dim); border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #timer { font: 600 40px/1 ui-monospace, monospace; }
  #timer.over { color: var(--accent); }
  #where { color: var(--dim); }
  h1 { margin: 0; font-size: 34px; line-height: 1.2; }
  #notes { font-size: 30px; line-height: 1.45; background: var(--panel); border-radius: 12px; padding: 24px 28px; margin: 0; }
  #next { color: var(--dim); font-size: 20px; margin: 0; }
  .help { color: var(--dim); font-size: 15px; margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <button id="open" type="button">Open the deck window</button>
    <span id="timer" aria-live="off">0:00</span>
    <button id="reset" type="button">Reset timer</button>
  </header>
  <p id="where">Open the deck, then share only that window in Teams or Zoom.</p>
  <h1 id="title"></h1>
  <p id="notes"></p>
  <p id="next"></p>
  <p class="help">Keys here drive the deck: → or Space next, ← back. Slides with zooms take 2–3 presses; the notes change when the slide does. Target about 7 minutes; the timer turns orange at 8.</p>
</main>
<script type="module">
  // The deck records its slide in location.hash (#1, #2, ...). Same origin, so
  // this window can read the hash and the slides' notes straight from the deck.
  const TARGET_SECONDS = 8 * 60
  const $ = id => document.getElementById(id)
  let deck = null
  let startedAt = null
  let shownIndex = -1

  $('open').addEventListener('click', () => {
    deck = window.open('deck.html', 'star-deck', 'popup,width=1280,height=760')
    shownIndex = -1
    // Leave focus on the page, not the button, so Space can't reopen (and reload) the deck.
    document.activeElement.blur()
  })
  $('reset').addEventListener('click', () => { startedAt = null; $('timer').textContent = '0:00'; $('timer').classList.remove('over') })

  function slides() {
    try { return [...deck.document.querySelectorAll('deck-stage > section')] } catch { return [] }
  }

  function render() {
    const all = slides()
    if (!all.length) return
    const index = Math.max(0, (parseInt((deck.location.hash || '#1').slice(1), 10) || 1) - 1)
    if (index === shownIndex) return
    shownIndex = index
    if (index > 0 && startedAt === null) startedAt = Date.now()
    const slide = all[index]
    $('where').textContent = `Slide ${index + 1} of ${all.length}`
    $('title').textContent = slide.querySelector('h1, h2')?.textContent.trim() || slide.dataset.label || ''
    $('notes').textContent = slide.dataset.speakerNotes || '(no notes)'
    const next = all[index + 1]
    $('next').textContent = next ? `Next: ${next.querySelector('h1, h2')?.textContent.trim() || next.dataset.label}` : 'Last slide.'
  }

  function tick() {
    if (deck && !deck.closed) render()
    if (startedAt !== null) {
      const s = Math.floor((Date.now() - startedAt) / 1000)
      $('timer').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
      $('timer').classList.toggle('over', s >= TARGET_SECONDS)
    }
  }
  setInterval(tick, 250)

  // Drive the deck from here so this window can keep focus. _advance is the
  // deck's single advance path, which the zoom steps hook, so steps play first.
  const DIRECTION = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, ' ': 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1 }
  window.addEventListener('keydown', e => {
    const dir = DIRECTION[e.key]
    if (!dir || !deck || deck.closed) return
    e.preventDefault()
    const stage = deck.document.querySelector('deck-stage')
    if (typeof stage?._advance !== 'function') { console.error('[presenter] deck-stage._advance missing; click the deck window and use its keys'); return }
    stage._advance(dir, 'keyboard')
  })
</script>
</body>
</html>
