<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Driftglass</title>
<meta name="description" content="Procedural aerial scenes that never repeat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --ink-dim: rgba(244, 241, 234, 0.84);
    --ink-faint: rgba(244, 241, 234, 0.64);
    --halo: 0 0 1px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.65), 0 0 10px rgba(0,0,0,.5), 0 0 26px rgba(0,0,0,.4);
    --glass: rgba(10, 12, 16, 0.62);
    --glass-edge: rgba(255, 255, 255, 0.09);
    --glow: #f3dcae;
    --ground: #000;
    --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: "Geist", ui-sans-serif, "Segoe UI", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body.idle, body.idle * { cursor: none !important; }

  #c {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: block;
    background: #000;
  }

  /* Chrome that fades in and out */
  .chrome {
    transition: opacity 900ms cubic-bezier(.2,.7,.2,1), transform 900ms cubic-bezier(.2,.7,.2,1);
  }
  body.idle .chrome { opacity: 0; pointer-events: none; }
  body.idle .dock { transform: translate(-50%, 10px); }


  /* Soft blurred scrims behind text so it stays legible on bright scenes */
  .scrim {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    backdrop-filter: blur(30px) saturate(1.05) brightness(.85);
    -webkit-backdrop-filter: blur(30px) saturate(1.05) brightness(.85);
    background: rgba(4, 6, 10, 0.13);
  }
  .scrim-top {
    top: 0; left: 0; right: 0;
    height: calc(150px + env(safe-area-inset-top, 0px));
    -webkit-mask-image: linear-gradient(#000 0%, #000 30%, rgba(0,0,0,.82) 48%, rgba(0,0,0,.55) 63%, rgba(0,0,0,.3) 77%, rgba(0,0,0,.12) 89%, rgba(0,0,0,.03) 96%, transparent 100%);
    mask-image: linear-gradient(#000 0%, #000 30%, rgba(0,0,0,.82) 48%, rgba(0,0,0,.55) 63%, rgba(0,0,0,.3) 77%, rgba(0,0,0,.12) 89%, rgba(0,0,0,.03) 96%, transparent 100%);
  }
  .scrim-cap {
    left: 0; bottom: 0;
    width: min(1000px, 100vw);
    height: min(600px, 85vh);
    -webkit-mask-image: radial-gradient(ellipse 100% 100% at 0% 100%, #000 0%, #000 30%, rgba(0,0,0,.82) 48%, rgba(0,0,0,.55) 63%, rgba(0,0,0,.3) 77%, rgba(0,0,0,.12) 89%, rgba(0,0,0,.03) 96%, transparent 100%);
    mask-image: radial-gradient(ellipse 100% 100% at 0% 100%, #000 0%, #000 30%, rgba(0,0,0,.82) 48%, rgba(0,0,0,.55) 63%, rgba(0,0,0,.3) 77%, rgba(0,0,0,.12) 89%, rgba(0,0,0,.03) 96%, transparent 100%);
    opacity: 0;
    transition: opacity 1400ms cubic-bezier(.2,.7,.2,1);
  }
  .caption.show + .scrim-cap, body:not(.idle) .scrim-cap { opacity: 1; }
  .mark, .keys, .caption { z-index: 2; }
  .dock { z-index: 3; }


  
  /* Heart */
  .icon.heart[aria-pressed="true"] { color: #f2a7a0; }
  .icon.heart[aria-pressed="true"] svg { fill: currentColor; }
  .icon.heart.pop svg { animation: pop 420ms cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

  /* Panels above the dock */
  .panel {
    position: fixed;
    z-index: 4;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    width: min(360px, calc(100vw - 32px));
    box-sizing: border-box;
    max-height: min(420px, 60vh);
    overflow-y: auto;
    padding: 10px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    border-radius: 20px;
    backdrop-filter: blur(22px) saturate(1.5);
    -webkit-backdrop-filter: blur(22px) saturate(1.5);
    box-shadow: 0 18px 50px -18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: opacity 400ms, transform 400ms cubic-bezier(.2,.7,.2,1);
  }
  body.idle .panel { opacity: 0; pointer-events: none; }
  .panel-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 10px 10px;
    font-family: var(--serif); font-style: italic; font-size: 22px;
  }
  .panel-count { font: 400 10.5px/1 var(--mono); letter-spacing: .14em; color: var(--ink-faint); font-style: normal; }
  .panel-empty { margin: 0; padding: 4px 10px 10px; font-size: 13px; line-height: 1.5; color: var(--ink-dim); }
  .fav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .fav { display: flex; align-items: center; gap: 4px; border-radius: 14px; }
  .fav:hover, .fav:focus-within { background: rgba(255,255,255,.06); }
  .fav.on { background: rgba(255,255,255,.1); }
  .fav-go {
    flex: 1; min-width: 0;
    appearance: none; border: 0; background: none; color: var(--ink); cursor: pointer; text-align: left;
    padding: 9px 10px; display: flex; align-items: center; gap: 12px; border-radius: 14px;
  }
  .fav-sw {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .fav-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .fav-name { font-family: var(--serif); font-size: 19px; line-height: 1; }
  .fav-meta { font: 400 10.5px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav-x {
    appearance: none; border: 0; background: none; color: var(--ink-faint); cursor: pointer;
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-right: 4px;
  }
  .fav-x:hover { color: var(--ink); background: rgba(255,255,255,.08); }
  .fav-x svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; }
  .opt {
    appearance: none; border: 0; background: none; color: var(--ink); cursor: pointer;
    display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 3px;
    text-align: left; padding: 10px 12px; border-radius: 14px; align-items: center;
  }
  .opt:hover { background: rgba(255,255,255,.06); }
  .opt-t { font-size: 14px; grid-column: 1; }
  .opt-k { font: 400 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); grid-column: 1; }
  .sw {
    grid-column: 2; grid-row: 1 / span 2;
    width: 36px; height: 21px; border-radius: 999px; background: rgba(255,255,255,.14); position: relative;
    transition: background 250ms;
  }
  .sw::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%;
    background: var(--ink); transition: transform 250ms cubic-bezier(.3,1.3,.5,1);
  }
  .opt[aria-pressed="true"] .sw { background: color-mix(in srgb, var(--glow) 70%, transparent); }
  .opt[aria-pressed="true"] .sw::after { transform: translateX(15px); background: #1a1712; }
  .speed-row { display: none; grid-template-columns: auto 1fr; }
  .vol-row { grid-template-columns: auto 1fr; }
  .vol-row.dim { opacity: .45; }
  .vol-row .speed2-wrap output { min-width: 2.8em; }
  .vol-row .speed2-wrap output { width: 2.2em; text-align: right; }
  .speed2-wrap { display: flex; align-items: center; gap: 10px; grid-column: 2; grid-row: 1; font: 400 11px/1 var(--mono); color: var(--ink-dim); }
  .speed2-wrap input { flex: 1; min-width: 0; width: auto; }
  @media (max-width: 480px) { .dock .speed { display: none; } .speed-row { display: grid; } }
  .icon[aria-expanded="true"] { color: var(--ink); background: rgba(255,255,255,.1); }


  /* Legibility on bright scenes */
  .mark, .keys, .caption { text-shadow: var(--halo); }
  .cap-sub { color: var(--ink); font-weight: 400; }
  .cap-code, .mark span, .keys { color: var(--ink-dim); font-weight: 500; }

  /* Wordmark */
  .mark {
    position: fixed;
    top: calc(22px + env(safe-area-inset-top, 0px));
    left: calc(26px + env(safe-area-inset-left, 0px));
    display: flex;
    align-items: baseline;
    gap: 12px;
    text-shadow: 0 1px 18px rgba(0,0,0,.5);
  }
  .mark b {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.01em;
  }
  .mark span {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  /* Scene caption, placed the way aerial screensavers label a location */
  .caption {
    position: fixed;
    left: calc(28px + env(safe-area-inset-left, 0px));
    bottom: calc(108px + env(safe-area-inset-bottom, 0px));
    max-width: min(560px, calc(100vw - 56px));
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 1400ms cubic-bezier(.2,.7,.2,1), transform 1400ms cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
    text-shadow: 0 2px 24px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.3);
  }
  .caption.show, body:not(.idle) .caption { opacity: 1; transform: none; }
  .cap-title {
    font-family: var(--serif);
    font-size: clamp(40px, 6vw, 68px);
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .cap-sub {
    margin-top: 12px;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
  }
  .cap-code {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  /* Dock */
  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    border-radius: 999px;
    backdrop-filter: blur(22px) saturate(1.2) brightness(.7);
    -webkit-backdrop-filter: blur(22px) saturate(1.2) brightness(.7);
    box-shadow: 0 18px 50px -18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
    max-width: calc(100vw - 32px);
    box-sizing: border-box;
  }
  .scenes { display: flex; gap: 2px; min-width: 0; }
  .chip {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink-dim);
    font: 400 13.5px/1 var(--sans);
    letter-spacing: 0.02em;
    padding: 11px 16px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 250ms, color 250ms;
    white-space: nowrap;
  }
  .chip::before {
    content: "";
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor;
    opacity: 0;
    transition: opacity 300ms, box-shadow 300ms;
  }
  .chip:hover { color: var(--ink); background: rgba(255,255,255,.06); }
  .chip[aria-selected="true"] { color: var(--ink); background: rgba(255,255,255,.1); }
  .chip[aria-selected="true"]::before { opacity: 1; background: var(--glow); box-shadow: 0 0 10px var(--glow); }
  .sep { width: 1px; height: 22px; background: var(--glass-edge); margin: 0 4px; flex: none; }
  .ctrls { display: flex; align-items: center; gap: 2px; }
  .icon {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink-dim);
    width: 40px; height: 38px;
    border-radius: 999px;
    display: grid; place-items: center;
    cursor: pointer;
    transition: background 250ms, color 250ms;
    flex: none;
  }
  .icon:hover { color: var(--ink); background: rgba(255,255,255,.07); }
  .icon[aria-pressed="true"] { color: var(--glow); }
  .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .speed {
    display: flex; align-items: center; gap: 10px;
    padding: 0 10px 0 8px;
    color: var(--ink-dim);
    font: 400 11px/1 var(--mono);
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
  }
  .speed output { width: 3.4em; text-align: right; }
  input[type="range"] {
    appearance: none; -webkit-appearance: none;
    width: 96px; height: 20px; background: transparent; cursor: pointer; margin: 0;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: rgba(255,255,255,.18); border-radius: 2px; }
  input[type="range"]::-moz-range-track { height: 2px; background: rgba(255,255,255,.18); border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink); margin-top: -5px; box-shadow: 0 0 0 4px rgba(255,255,255,.08);
  }
  input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--ink); }

  button:focus-visible, input:focus-visible { outline: 1.5px solid var(--glow); outline-offset: 2px; }

  .keys {
    position: fixed;
    top: calc(26px + env(safe-area-inset-top, 0px));
    right: calc(26px + env(safe-area-inset-right, 0px));
    font: 400 10.5px/1.9 var(--mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: right;
    text-shadow: 0 1px 12px rgba(0,0,0,.6);
  }
  .keys kbd { font: inherit; color: var(--ink-dim); }

  .fail {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 0 24px; text-align: center;
    font-family: var(--serif); font-size: 26px; color: var(--ink-dim);
  }
  .fail .restart {
    margin-top: 18px; padding: 10px 18px; border-radius: 999px; border: 1px solid currentColor;
    background: none; color: inherit; font: 16px var(--sans, system-ui); cursor: pointer;
  }

  /* The one-row dock is ~920px wide; below 960px it wraps to two rows or the scene tabs spill into the controls. */
  @media (max-width: 960px) {
    .dock { flex-wrap: wrap; justify-content: center; border-radius: 22px; width: calc(100vw - 32px); gap: 4px; }
    .sep { display: none; }
    .scenes { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .chip { padding: 10px 6px; justify-content: center; font-size: 13px; }
    .chip::before { display: none; }
    .ctrls { width: 100%; justify-content: space-between; }
    .speed { flex: 1; min-width: 0; padding: 0 6px; }
    .speed input { flex: 1; min-width: 0; width: auto; }
    .caption { bottom: calc(140px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (max-width: 720px) {
    .keys { display: none; }
    .mark span { display: none; }
  }
  @media (max-width: 480px) {
    .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .caption { bottom: calc(180px + env(safe-area-inset-bottom, 0px)); }
    .cap-title { font-size: 38px; }
  }
  @media (hover: none) { .keys { display: none; } }
</style>
</head>
<body>


<canvas id="c" aria-label="Procedural aerial scene"></canvas>

<div class="scrim scrim-top chrome" aria-hidden="true"></div>

<div class="mark chrome"><b>Driftglass</b><span id="res">—</span></div>

<div class="keys chrome" aria-hidden="true">
  <div><kbd>← →</kbd> scene · <kbd>N</kbd> new variation · <kbd>S</kbd> favorite · <kbd>L</kbd> list</div>
  <div><kbd>Space</kbd> pause · <kbd>T</kbd> tour · <kbd>G</kbd> glow · <kbd>M</kbd> sound · <kbd>B</kbd> tilt-shift · <kbd>F</kbd> fullscreen</div>
</div>

<div class="caption" id="caption" aria-live="polite">
  <div class="cap-title" id="capTitle"></div>
  <div class="cap-sub" id="capSub"></div>
  <div class="cap-code" id="capCode"></div>
</div>
<div class="scrim scrim-cap" aria-hidden="true"></div>

<div class="dock chrome" id="dock">
  <div class="scenes" id="scenes" role="tablist" aria-label="Scenes"></div>
  <div class="sep"></div>
  <div class="ctrls">
    <button class="icon" id="btnSeed" title="New variation (N)" aria-label="New variation">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/></svg>
    </button>
    <button class="icon" id="btnSound" title="Sound (M)" aria-label="Sound" aria-pressed="false">
      <svg viewBox="0 0 24 24" id="icoSound"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5c1 1.4 1 3.6 0 5" opacity=".35"/><path d="M18.5 7c2.2 2.8 2.2 7.2 0 10" opacity=".35"/></svg>
    </button>
    <button class="icon heart" id="btnFav" title="Save to favorites (S)" aria-label="Save to favorites" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7.2-4.5-7.2-10.1A4.1 4.1 0 0 1 12 7.2a4.1 4.1 0 0 1 7.2 2.7C19.2 15.5 12 20 12 20z"/></svg>
    </button>
    <button class="icon" id="btnPlay" title="Pause (Space)" aria-label="Pause">
      <svg viewBox="0 0 24 24" id="icoPlay"><path d="M9 6v12M15 6v12"/></svg>
    </button>
    <label class="speed" for="speed">
      <input type="range" id="speed" min="0.1" max="3" step="0.05" value="0.5" aria-label="Speed">
      <output id="speedOut">0.5×</output>
    </label>
    <button class="icon" id="btnFavs" title="Favorites (L)" aria-label="Favorites" aria-expanded="false" aria-controls="favPanel">
      <svg viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M18.5 20.5s-3-1.9-3-4.2a1.6 1.6 0 0 1 3-1 1.6 1.6 0 0 1 3 1c0 2.3-3 4.2-3 4.2z"/></svg>
    </button>
    <button class="icon" id="btnSet" title="Display options" aria-label="Display options" aria-expanded="false" aria-controls="setPanel">
      <svg viewBox="0 0 24 24"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/></svg>
    </button>
    <button class="icon" id="btnFull" title="Fullscreen (F)" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>

<div class="panel" id="favPanel" role="dialog" aria-label="Favorites" hidden>
  <div class="panel-head"><span>Favorites</span><span class="panel-count" id="favCount"></span></div>
  <ul class="fav-list" id="favList"></ul>
  <p class="panel-empty" id="favEmpty">Tap the heart to keep the scene you're watching, with its speed and look.</p>
</div>

<div class="panel" id="setPanel" role="dialog" aria-label="Display options" hidden>
  <div class="panel-head"><span>Display</span></div>
  <label class="opt speed-row" for="speed2"><span class="opt-t">Speed</span><span class="speed2-wrap"><input type="range" id="speed2" min="0.1" max="3" step="0.05" value="0.5" aria-label="Speed"><output id="speedOut2">0.5×</output></span></label>
  <button class="opt" id="btnTour" type="button" aria-pressed="false"><span class="opt-t">Tour scenes</span><span class="opt-k">every 90 s · T</span><i class="sw"></i></button>
  <button class="opt" id="btnTourFav" type="button" aria-pressed="false"><span class="opt-t">Tour favorites only</span><span class="opt-k">needs 2 or more</span><i class="sw"></i></button>
  <button class="opt" id="btnGlow" type="button" aria-pressed="true"><span class="opt-t">Soft glow</span><span class="opt-k">G</span><i class="sw"></i></button>
  <button class="opt" id="btnSound2" type="button" aria-pressed="false"><span class="opt-t">Sound</span><span class="opt-k">M · surf, wind, ocean, drone</span><i class="sw"></i></button>
  <label class="opt vol-row" for="vol"><span class="opt-t">Volume</span><span class="speed2-wrap"><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"><output id="volOut">70</output></span></label>
  <button class="opt" id="btnBirds" type="button" aria-pressed="true"><span class="opt-t">Birds</span><span class="opt-k">sandpipers on the beach, gannets at sea</span><i class="sw"></i></button>
  <button class="opt" id="btnFish" type="button" aria-pressed="true"><span class="opt-t">Fish</span><span class="opt-k">schools under the surface at sea and in the shallows</span><i class="sw"></i></button>
  <button class="opt" id="btnTilt" type="button" aria-pressed="true"><span class="opt-t">Tilt-shift</span><span class="opt-k">B</span><i class="sw"></i></button>
  <label class="opt vol-row" id="tiltRow" for="tiltLevel"><span class="opt-t">Tilt-shift strength</span><span class="speed2-wrap"><input type="range" id="tiltLevel" min="0" max="2" step="0.05" value="1" aria-label="Tilt-shift strength"><output id="tiltOut">100%</output></span></label>
</div>

<script>
(() => {
"use strict";

/* ─────────────────────────── GLSL ─────────────────────────── */

const VS = `#version 300 es
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.-1.,0.,1.);}`;

const COMMON = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec2 uCam; uniform float uRot; uniform float uZoom; uniform vec2 uOff;
out vec4 fragColor;
#define PI 3.14159265
#define TAU 6.2831853
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
vec2 gr(vec2 i){return hash22(i)*2.-1.;}
float gn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*f*(f*(f*6.-15.)+10.);
 return 2.*mix(mix(dot(gr(i),f),dot(gr(i+vec2(1,0)),f-vec2(1,0)),u.x),mix(dot(gr(i+vec2(0,1)),f-vec2(0,1)),dot(gr(i+vec2(1,1)),f-vec2(1,1)),u.x),u.y);}
const mat2 M2=mat2(.8,-.6,.6,.8);
float fbm(vec2 p,int o){float s=0.,a=.5;for(int i=0;i<8;i++){if(i>=o)break;s+=a*gn(p);p=M2*p*2.03+vec2(3.1,1.7);a*=.5;}return s;}
float ridged(vec2 p,int o){float s=0.,a=.5;for(int i=0;i<8;i++){if(i>=o)break;float n=1.-abs(gn(p));s+=a*n*n;p=M2*p*2.03+vec2(1.3,7.1);a*=.5;}return s;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec2 screenUV(){return (gl_FragCoord.xy-.5*uRes)/uRes.y;}
`;

/* Nebula: layered, domain-warped emission and dust with parallax and real star PSFs */
const NEBULA = COMMON + `
uniform vec3 uPalA,uPalB,uPalC;
vec3 stars(vec2 p,float cellPx,float dens,float bright){
  vec2 i=floor(p),f=fract(p);vec3 c=vec3(0);
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
    vec2 g=vec2(float(x),float(y));vec2 id=i+g;
    if(hash12(id*1.13+uOff)>dens)continue;
    vec2 d=(g+hash22(id+uOff*.7)-f)*cellPx;
    float h2=hash12(id*3.7+11.);
    float b=pow(h2,18.)*bright*5.+.03+h2*.1;
    float r2=dot(d,d);
    float core=exp(-r2*.85);
    float halo=exp(-sqrt(r2)*.4)*.07*smoothstep(.4,1.,h2);
    float spike=0.;
    if(h2>.985){vec2 ad=abs(d);spike=(exp(-ad.x*1.2)*exp(-ad.y*.055)+exp(-ad.y*1.2)*exp(-ad.x*.055))*.22;}
    vec3 tc=mix(vec3(1.,.7,.48),vec3(.7,.8,1.),hash12(id*7.1));
    c+=tc*b*(core+halo+spike);
  }
  return c;
}
void main(){
  vec2 uv=rot(uRot)*screenUV();float t=uTime;
  vec3 col=vec3(.0012,.0016,.004);
  col+=stars((uv*uZoom+uCam*.22)*15.,uRes.y/(uZoom*15.),.55,.5);
  col+=stars((uv*uZoom+uCam*.22)*6.+37.,uRes.y/(uZoom*6.),.22,.9);
  const int L=5;
  for(int i=0;i<L;i++){
    float fi=float(i),k=fi/float(L-1);
    float par=mix(.45,1.5,k),sc=mix(1.1,.72,k);
    vec2 p=rot(fi*1.3)*(uv*uZoom*sc)+uCam*par+uOff+vec2(fi*17.1,-fi*9.3);
    float tt=t*.018;
    vec2 q=vec2(fbm(p*.33+vec2(0.,tt),3),fbm(p*.33+vec2(5.2,1.3)-vec2(tt*.7,0.),3));
    vec2 r=vec2(fbm(p*.55+1.5*q+vec2(1.7,9.2)+tt*.5,3),fbm(p*.55+1.5*q+vec2(8.3,2.8),3));
    float d=fbm(p*.8+1.3*r,4);
    float region=smoothstep(-.12,.38,fbm(p*.09+vec2(3.,fi),3)+.05);
    float dens=smoothstep(-.04,.5,d+.2*r.x)*region;
    float fil=pow(ridged(p*1.1+1.1*r,4),6.)*region;
    vec3 emi=mix(uPalC,uPalB,smoothstep(-.3,.3,q.x+r.y));
    emi=mix(emi,uPalA,smoothstep(.35,.85,dens+fil*.5)*.85);
    float bright=mix(1.35,.75,k);
    vec3 E=emi*(dens*dens*1.25+fil*1.7)*bright;
    float dust=smoothstep(.1,.5,fbm(p*.9+1.6*r+7.,4)+.05)*mix(.15,1.,k)*smoothstep(.0,.3,region);
    col=col*exp(-(dens*.55+dust*2.4))+E;
    col+=uPalA*.5*dust*(1.-dust)*dens;
    if(i==2)col+=stars((uv*uZoom*sc+uCam*par)*3.2+91.,uRes.y/(uZoom*sc*3.2),.13,1.3);
  }
  col+=stars((uv*uZoom*.7+uCam*1.8)*2.1+5.,uRes.y/(uZoom*.7*2.1),.07,1.6);
  fragColor=vec4(col,1);
}`;

/* Cloudline and Open Water share one ocean: stacked exponential-sine waves with drag, plus clouds or their shadows */
const CLOUDS = COMMON + `
uniform vec3 uSun,uSunCol,uSky,uDeep,uScatter;uniform float uCover,uMode,uWaveScale,uWindAng,uMorph;uniform vec2 uWind,uWindOff;
uniform sampler2D uFish;
float cloudV(vec2 p,float t,int o){
  t*=uMorph;
  vec2 q=vec2(fbm(p*.16+vec2(t*.012,0.),2),fbm(p*.16+vec2(4.3,1.9)-vec2(0.,t*.01),2));
  float big=fbm(p*.07+vec2(9.,3.)+t*.004,2);
  vec2 pp=p*.45+1.1*q;
  float d=fbm(pp+vec2(t*.02,0.),o);
  /* Evolution layer: two copies of the body noise from different regions, crossfaded. Each copy jumps to a
     new region only while its weight is zero, so clouds keep their place (q, big) but re-form without a seam. */
  float ev=t*.095,f0=fract(ev);
  float w0=smoothstep(0.,1.,1.-abs(2.*f0-1.)),w1=1.-w0;
  vec2 o0=(hash22(vec2(floor(ev),3.1))-.5)*80.,o1=(hash22(vec2(floor(ev+.5),7.7))-.5)*80.;
  float evo=(w0*fbm(pp*1.3+o0,o-1)+w1*fbm(pp*1.3+o1,o-1))/sqrt(w0*w0+w1*w1);
  d=d*.85+evo*.6;
  float bl=0.,ba=.5;vec2 bp=pp*2.4+5.+vec2(0.,t*.035);
  for(int i=0;i<3;i++){bl+=ba*abs(gn(bp));bp=M2*bp*2.1-vec2(t*.02,0.);ba*=.5;}
  d=d*1.15+big*.4+uCover+.22*(bl-.3);
  return d*3.2;
}
/* log roll-off instead of a hard clamp at 1: dense cores keep slopes, so they shade instead of going flat white */
float cloudD(vec2 p,float t,int o){return log(1.+max(cloudV(p,t,o),0.));}
float wave(vec2 p,float t,int it){
  float fr=1.,tm=1.,w=1.,sv=0.,sw=0.;
  for(int i=0;i<32;i++){if(i>=it)break;
    float fi=float(i);
    float ang=uWindAng+(fract(sin(fi*12.9898+4.1)*43758.5453)-.5)*mix(1.2,2.6,fi/32.);
    vec2 d=vec2(cos(ang),sin(ang));
    float x=dot(d,p)*fr+t*tm;
    float e=exp(sin(x)-1.);
    p-=d*e*cos(x)*w*.36;
    sv+=e*w;sw+=w;
    w*=.83;fr*=1.18;tm*=1.07;
  }
  return sv/sw;
}
void main(){
  vec2 uv=rot(uRot)*screenUV();float t=uTime;
  vec2 po=uv*uZoom+uCam+uOff;
  const float CS=.4;
  vec2 pc=(uv*uZoom*1.8+uCam+uOff*1.3)*CS+uWindOff;
  vec2 pcg=pc;
  vec3 L=uSun;
  vec3 V=normalize(vec3(uv*.8,-1.));
  vec2 pw=po*uWaveScale;float tw=t*1.25;
  float e=max(uZoom/uRes.y*.9,.002);
  float HS=.24/uWaveScale;
  float h0=wave(pw,tw,23),hx=wave(pw+vec2(e*uWaveScale,0.),tw,23),hy=wave(pw+vec2(0.,e*uWaveScale),tw,23);
  vec3 n=normalize(vec3((h0-hx)*HS/e,(h0-hy)*HS/e,1.));
  float sh;
  if(uMode<.5){
    /* the clouds sit ~1,800 m up, so each shadow lands about a cloud-width away from the sun, soft-edged */
    float cs=cloudV(pcg+L.xy/L.z*1.1,t,3);
    sh=mix(1.,.2,smoothstep(-.5,.6,cs));
  }else{
    float c=cloudV(pcg*.55,t,3);
    sh=1.-.5*smoothstep(-.9,1.,c);
  }
  vec3 Rf=reflect(V,n);
  float rl=max(dot(Rf,L),0.);
  float spec=pow(rl,2400.)*40.+pow(rl,220.)*2.6+pow(rl,14.)*.12;
  float fres=.02+.98*pow(1.-max(dot(-V,n),0.),5.);
  float dif=max(dot(n,L),0.);
  float relief=clamp(1.+2.6*dot(n.xy,normalize(L.xy)),.25,2.2);
  /* fish swim under the surface: they replace the deep water colour, seen through the refracting waves; the lit water
     of a crest lies over them, brightening them the way it brightens the deep, and its scattered glow sits on top */
  float lift=.7+.6*h0;
  vec4 fsh=texture(uFish,gl_FragCoord.xy/uRes+n.xy*.006);
  vec3 base=(uDeep*(1.-fsh.a)+fsh.rgb)*lift+uScatter*pow(h0,3.)*.5*(.3+.7*dif);
  /* Cloudline's cumulus cast deep shadows; Open Water's high cloud stays soft (its original factors) */
  vec2 shK=uMode<.5?vec2(.75,.6):vec2(.5,.45);
  vec3 ocean=base*(1.-shK.x+shK.x*sh)*relief;
  ocean+=uSky*fres*(1.-shK.y+shK.y*sh);
  ocean+=uSunCol*spec*sh;
  float wn=(gn(po*7.+vec2(t*.3,0.))+gn(M2*po*9.-vec2(0.,t*.35)))*.5;
  float wc=smoothstep(.8,.95,h0+.14*wn)*smoothstep(.05,.5,gn(po*.5+vec2(t*.02,-t*.015)));
  ocean=mix(ocean,vec3(.78,.83,.85)*(.35+.65*sh),wc*.75);
  vec3 col=ocean;
  if(uMode<.5){
    float v=cloudV(pc,t,5);
    float wisp=fbm(M2*pc*vec2(1.3,3.8)+vec2(t*uMorph*.01,0.)+17.,4);
    float va=v+.7*wisp+.1;
    if(va>-.5){
      float d=log(1.+max(v,0.));
      float ex=.04;
      float d1=cloudD(pc+vec2(ex,0.),t,5),d2=cloudD(pc-vec2(ex,0.),t,5),d3=cloudD(pc+vec2(0.,ex),t,5),d4=cloudD(pc-vec2(0.,ex),t,5);
      const float Hc=.45;
      vec3 cn=normalize(vec3(-(d1-d2)/(2.*ex)*Hc,-(d3-d4)/(2.*ex)*Hc,1.));
      float mean=(d1+d2+d3+d4)*.25;
      float ao=clamp(.8+(d-mean)*4.,.42,1.1);
      vec2 Ld=normalize(L.xy);float tanE=L.z/max(length(L.xy),.05);
      float occ=0.,hc=d*Hc;
      for(int k=1;k<=6;k++){float st=float(k)*.045;float ch=cloudD(pc+Ld*st,t,4)*Hc;occ+=smoothstep(0.,.06,ch-(hc+st*tanE));}
      float trans=exp(-occ*.55);
      float cd=max(dot(cn,L),0.);
      vec3 cc=uSunCol*cd*trans*.9+uSky*(.3+.35*cn.z)*ao+uSunCol*.07*ao;
      cc=mix(cc,uSunCol*.55+uSky*.3,(1.-smoothstep(0.,.25,d))*.45);
      col=mix(col,cc,smoothstep(-.5,.75,va)*mix(.45,1.,smoothstep(-.15,.5,v)));
    }
  }
  col=mix(col,uSky*.85,.05);
  fragColor=vec4(col,1);
}`;

/* Shoreline: breaking waves, swash run-up and backwash, lace foam, wet sand, caustics */
const SHORE = COMMON + `
uniform vec3 uSun,uSunCol,uSky,uSand,uShallow,uDeepW;uniform float uWave; /* wave phase in radians, from its own clock (see stepInst) */
uniform sampler2D uFish;
float worley(vec2 p,float t){vec2 i=floor(p),f=fract(p);float d1=9.,d2=9.;
 for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));vec2 h=hash22(i+g);
  vec2 o=.5+.42*sin(t*(.7+h.yx*.9)+TAU*h);vec2 r=g+o-f;float d=dot(r,r);
  if(d<d1){d2=d1;d1=d;}else if(d<d2){d2=d;}}
 return sqrt(d2)-sqrt(d1);}
float lace(vec2 q,float t){
  q+=.45*vec2(gn(q*.33+vec2(t*.28,0.)),gn(q*.33+vec2(3.7,-t*.25)));
  float w1=worley(q,t),w2=worley(q*2.4+5.3,t*1.7);
  return (1.-smoothstep(0.,.28,w1))*.62+(1.-smoothstep(0.,.2,w2))*.45;
}
void main(){
  vec2 uv=rot(uRot)*screenUV();float t=uTime;
  vec2 p=uv*uZoom+uCam;
  vec2 pn=p+uOff;
  vec3 L=uSun;
  float bend=1.3*fbm(vec2(pn.x*.07,3.1),3)+.3*fbm(vec2(pn.x*.3,8.),2);
  float s=p.y+bend;
  float f=2.4;
  /* arrival time wanders along the shore and over time, so crests meet the backwash irregularly instead of zippering */
  float warp=2.4*fbm(vec2(pn.x*.1,1.7),3)+.33*p.x+1.1*fbm(vec2(pn.x*.32+5.,t*.045),2)+.35*gn(vec2(pn.x*1.3,t*.11+2.));
  float th=s*f-uWave+warp;
  float phr=(uWave+.3*f-warp)/TAU;
  float ph=fract(phr),cyc=floor(phr);
  float amp=.62+.3*gn(vec2(cyc*1.71,pn.x*.06));
  float up=.3;
  float e=ph<up?1.-pow(1.-ph/up,2.4):1.-smoothstep(0.,1.,(ph-up)/(1.-up));
  float lobe=.15*gn(vec2(pn.x*1.1,cyc*3.1))+.05*gn(vec2(pn.x*3.7,cyc*5.3));
  float edge=-.3+e*(amp*1.25+lobe);
  float emax=-.3+amp*1.25+lobe;
  float hm=.98+.12*fbm(vec2(pn.x*.2,4.),2);
  float aa=max(fwidth(s),1e-4)*1.2;
  float wd=edge-s;
  float covered=smoothstep(-aa,aa,wd);
  float offs=max(-.3-s,0.);
  float bar=.3*exp(-pow((offs-1.7)*1.6,2.))*(.6+.4*gn(pn*.4));
  float depth=max(max(wd,0.)*.1+offs*.72-bar,.004);

  /* sand, dunes, wetness */
  float g1=fbm(pn*1.3,3);
  vec3 sand=uSand*(.9+.2*g1)*(.97+.06*gn(pn*44.));
  float rip=cos(s*28.+3.*fbm(pn*.9,2)+g1*2.);
  float ripMask=smoothstep(1.3,-.2,s);
  float dune=smoothstep(2.5,3.4,s+.9*fbm(pn*.45+2.,3));
  vec3 grass=mix(vec3(.12,.15,.06),vec3(.3,.29,.14),fbm(pn*4.,3)+.5)*(.75+.5*max(gn(pn*24.),0.));
  sand*=1.+.07*rip*ripMask*(1.-dune);
  float duneShade=1.+.25*fbm(pn*.7+9.,3);
  sand=mix(sand,grass*duneShade,dune*.9);
  float damp=smoothstep(hm+.22,hm-.08,s)*.5;
  float recent=exp(-max(s-edge,0.)*2.2)*smoothstep(-.03,.03,s-edge)*smoothstep(emax+.1,emax-.02,s)*smoothstep(up-.02,up+.1,ph)*(1.-smoothstep(.72,1.,ph));
  float wet=clamp(max(damp,recent*.95),0.,1.)*(1.-dune);
  sand=mix(sand,sand*vec3(.5,.49,.47),wet);
  float wr=smoothstep(.08,0.,abs(s-hm-.3+.12*gn(pn*2.)))*smoothstep(.05,.35,fbm(pn*7.,3));
  sand=mix(sand,vec3(.11,.085,.05),wr*.85);
  float shell=step(.996,hash12(floor(pn*90.)))*smoothstep(hm+.9,hm,s)*(1.-covered)*(1.-dune);
  sand=mix(sand,vec3(.95,.9,.84),shell*.6);

  /* wave height field (steep landward face, long seaward back) */
  float shoal=smoothstep(4.5,1.2,offs)*(1.-smoothstep(.0,.4,-offs));
  float fr=fract(th/TAU);
  float hA=max(smoothstep(.3,1.,fr),exp(-fr*22.));
  float fr2=fract((th+.02*f)/TAU);
  float hB=max(smoothstep(.3,1.,fr2),exp(-fr2*22.));
  float A=.1*shoal*(1.-smoothstep(-.35,-.1,s));
  float dhds=(hB-hA)/.02*A;
  vec2 chop=vec2(gn(pn*9.+vec2(t*.45,0.)),gn(pn*9.+vec2(4.,-t*.4)))*.09+vec2(gn(pn*26.-t*.6),gn(pn*26.+t*.5))*.035;
  vec3 n=normalize(vec3(chop.x,chop.y-dhds,1.));

  /* water */
  vec2 cp=pn*4.5;
  float c1=gn(cp+vec2(t*.33,t*.21)),c2=gn(cp*1.37-vec2(t*.24,-t*.29)+3.);
  float cz=c1+c2+.35*gn(cp*.5+vec2(-t*.1,t*.07));
  float caus=pow(max(0.,1.-abs(cz)*.9),4.);
  vec3 bottom=sand*(1.+caus*.3*exp(-depth*3.2)*smoothstep(0.,.08,depth));
  /* fish shadows on the sand: fish swim 40% of the way down the water column, and sunlight runs steeper once it's in the water */
  vec2 fuv=gl_FragCoord.xy/uRes;
  vec2 so=rot(-uRot)*(L.xy/L.z*.6*depth*.6)/uZoom*vec2(uRes.y/uRes.x,1.);
  vec2 px=1.5/uRes;
  float fs=(texture(uFish,fuv+so+px).a+texture(uFish,fuv+so-px).a+texture(uFish,fuv+so+vec2(px.x,-px.y)).a+texture(uFish,fuv+so-vec2(px.x,-px.y)).a)*.25;
  bottom*=1.-.62*fs;
  vec3 tr=exp(-depth*vec3(4.2,1.25,.85));
  vec3 insc=mix(uShallow,uDeepW,1.-exp(-depth*.8));
  vec3 water=bottom*tr+insc*(1.-tr);
  vec4 fsh=texture(uFish,fuv+chop*.035); /* ripples bend the view; the big wave face would smear them away */
  water=water*(1.-fsh.a)+fsh.rgb*(1.+.5*caus);
  water*=1.+dhds*.9;
  vec3 V=normalize(vec3(uv*.8,-1.));
  vec3 Rf=reflect(V,n);
  float rl=max(dot(Rf,L),0.);
  float fres=.02+.98*pow(1.-max(dot(-V,n),0.),5.);
  water+=uSky*fres*.9+uSunCol*(pow(rl,700.)*30.+pow(rl,60.)*.35);

  /* foam */
  float brk=smoothstep(2.9,1.4,offs+.5*gn(pn*.8))*step(.001,offs+.35);
  /* crests stay mostly clean in deeper water; whitewater builds as they reach the shallows */
  float brkC=smoothstep(2.4,.75,offs+.3*gn(pn*.8))*step(.001,offs+.35);
  float crestF=brkC*(exp(-(1.-fr)*5.)*.95+exp(-fr*45.)*.9436+.12*smoothstep(1.6,.5,offs)); /* equal on both sides of the crest line: no seam */
  /* every swash quantity is continuous across the cycle reset, so no seam sweeps across the beach */
  float ramp=smoothstep(0.,.05,ph);
  /* bubbles: fresh when the bore arrives, thinning steadily as the run-up slows, a faint remnant in the backwash */
  float life=mix(.12,(1.-.78*smoothstep(.03,up*1.15,ph))*(1.-.45*smoothstep(up,1.,ph)),ramp);
  float lead=exp(-max(wd,0.)*15.)*mix(.2,1.,ramp)*(ph<up?1.:mix(1.,.2,smoothstep(0.,1.,(ph-up)/(1.-up))));
  float sheet=smoothstep(-.4,-.1,s)*exp(-max(wd,0.)*2.2)*(1.-ph)*.65*ramp;
  float swF=covered*smoothstep(-.6,-.25,s)*max(lead,sheet);
  float lC=lace(vec2(pn.x*1.1,th/f*1.6)*4.2,t);
  vec2 lq=vec2(pn.x,(s-edge)*1.4)*5.5;
  float lS=lace(lq+vec2(cyc*13.1,cyc*7.7),t*1.2);
  if(ramp<1.)lS=mix(lace(lq+vec2((cyc-1.)*13.1,(cyc-1.)*7.7),t*1.2),lS,ramp);
  float age=min(1.-fr,fr*9.);
  float foamC=smoothstep(.5+.28*age,.8+.2*age,crestF*(.5+lC));
  float fade_=1.-life;
  float foamS=max(smoothstep(.45+.32*fade_,.75+.22*fade_,swF*(.45+lS)*mix(.35,1.,life)),smoothstep(.75,.95,lead*covered)*smoothstep(.2,.7,life));
  /* the incoming whitewater keeps its momentum over the retreating backwash: it spills a little past the
     water line as a thinning sheet, loses its bubbles gradually as it climbs the beach, and throws spray */
  float swZ=smoothstep(-.4,-.2,s);
  float vary=.5+.5*gn(vec2(pn.x*.55,phr*.8+3.));
  float crestLife=mix(1.,exp(-max(s+.3,0.)*mix(.8,2.8,vary)),swZ);
  float ov=mix(.03,.16,1.-vary);
  float overrun=smoothstep(-ov,.03,wd);
  float foamCs=foamC*crestLife*mix(.35,1.,smoothstep(-.02,.06,wd));
  float foam=max(foamCs*overrun,foamS*covered);
  vec3 foamCol=vec3(.93,.96,.98)*(.86+.14*n.z+.1*lC)+uSunCol*.08;
  vec3 col=mix(sand,water,covered);
  col*=1.-.18*smoothstep(.2,.9,foam)*(1.-foam);
  col=mix(col,foamCol,foam*.96);
  col+=uSky*.35*recent*(1.-covered);
  /* spray: the breaking lip throws mist and droplets as it reaches the shallows, drifting up the beach */
  float lipF=exp(-(1.-fr)*6.)+exp(-fr*9.);
  float zone=smoothstep(1.9,.8,offs+.3*gn(pn*.5+vec2(t*.03,0.)))*smoothstep(-.1,.3,offs);
  float impact=lipF*zone*brk*(.55+.45*smoothstep(-.2,.4,gn(vec2(pn.x*.9,phr*1.3))));
  float runF=covered*exp(-max(wd,0.)*8.)*(1.-smoothstep(0.,.2,ph))*ramp*smoothstep(-.6,-.2,s);
  float collide=crestF*swZ*crestLife*exp(-abs(wd)*12.)*smoothstep(up-.02,up+.1,ph)*1.4;
  float sprayAmt=clamp(max(max(impact,runF*.75),collide),0.,1.);
  vec2 mq=vec2(pn.x*2.2+t*.06,pn.y*2.2-t*.42);
  float mist=fbm(mq+.6*vec2(gn(mq*.7+t*.1),gn(mq*.7-3.)),4);
  float mistA=clamp(sprayAmt*1.15,0.,1.)*smoothstep(-.3,.4,mist)*.62;
  float drops=0.;
  for(int L=0;L<2;L++){
    float fl=float(L),sc=mix(42.,78.,fl);
    vec2 q=pn*sc+vec2(t*sc*.012,-t*sc*mix(.1,.16,fl));
    vec2 id=floor(q),fq=fract(q)-.5;
    vec2 h=hash22(id+fl*17.3);
    float life=fract(h.x*7.1+t*(.5+h.y*.8));
    float rr=length(fq-(h-.5)*.6);
    drops+=smoothstep(.26,.03,rr)*step(.4,h.y)*sin(life*PI)*mix(1.,.7,fl);
  }
  vec3 sprayCol=vec3(.94,.97,1.)+uSunCol*.12;
  col=mix(col,sprayCol,mistA);
  col+=sprayCol*1.6*drops*min(sprayAmt*1.4,1.)*smoothstep(-.3,.3,mist+.2);

  col+=uSunCol*.12*exp(-abs(wd)*70.)*(1.-foam);
  fragColor=vec4(col,1);
}`;


/* Birds: instanced quads, each drawing a top-down bird (or its soft shadow) from a signed-distance planform */
const BIRD_VS = `#version 300 es
precision highp float;
uniform vec4 uA[32];uniform vec4 uB[32];
uniform vec2 uRes,uSunXY;uniform float uSunZ,uShadow;
out vec2 vL;flat out vec4 vB;flat out vec2 vSun;flat out float vPx;flat out float vSoft;
const vec2 Q[6]=vec2[6](vec2(-1,-1),vec2(1,-1),vec2(1,1),vec2(-1,-1),vec2(1,1),vec2(-1,1));
void main(){
  vec4 a=uA[gl_InstanceID],b=uB[gl_InstanceID];
  vec2 f=vec2(cos(a.z),sin(a.z)),r=vec2(-f.y,f.x);
  float hs=a.w;
  float soft=uShadow>.5?(b.y/hs)*.3:0.;
  vec2 L=Q[gl_VertexID]*(1.25+soft*1.2);
  vec2 c=a.xy;
  if(uShadow>.5)c-=uSunXY/max(uSunZ,.25)*b.y;
  vec2 p=c+(f*L.x+r*L.y)*hs;
  gl_Position=vec4(p.x*2.*uRes.y/uRes.x,p.y*2.,0.,1.);
  vL=L;vB=b;vSun=vec2(dot(uSunXY,f),dot(uSunXY,r));vPx=1./(hs*uRes.y);vSoft=soft;
}`;

const BIRD_FS = `#version 300 es
precision highp float;
in vec2 vL;flat in vec4 vB;flat in vec2 vSun;flat in float vPx;flat in float vSoft;
uniform float uShadow,uSunZ;
out vec4 o;
float sdEll(vec2 p,vec2 r){return (length(p/r)-1.)*min(r.x,r.y);}
float h21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
void main(){
  float u=vL.x,v=vL.y,ty=vB.z,th=vB.x;
  float aa=vPx*1.2;
  if(ty>2.5){
    /* sandpiper on the sand, seen from above: plump body, round head, short dark bill; th = peck */
    float hx=.5+.14*th;
    float db=sdEll(vec2(u+.06,v),vec2(.56,.3));
    float dh=length(vec2(u-hx,v))-.19;
    float dk=max(abs(v)-.035,max(u-(hx+.4),(hx+.12)-u));
    float dtl=max(max(-(u+.55)-.2,u+.55),abs(v)-(.13-(-(u+.55))*.5));
    float d=min(min(min(db,dh),dk),dtl);
    if(uShadow>.5){
      float s=aa+vSoft+.06;
      float a=(1.-smoothstep(-s,s,d+.02))*.5*vB.w;
      if(a<.002)discard;
      o=vec4(0.,0.,0.,a);return;
    }
    float m=1.-smoothstep(-aa,aa,d);
    if(m<.002)discard;
    float mott=h21(floor(vec2(u,v)*14.)+vB.y*977.);
    vec3 back=mix(vec3(.075,.062,.048),vec3(.15,.125,.095),mott);
    back=mix(back,vec3(.045,.037,.03),smoothstep(.12,.26,abs(v))*smoothstep(.35,-.1,u)*.7);
    vec3 col=back;
    if(dh<0.)col=mix(vec3(.16,.14,.115),vec3(.1,.085,.07),smoothstep(0.,.15,abs(v)));
    if(dtl<0.&&db>0.)col=vec3(.04,.033,.027);
    if(dk<0.&&dh>0.)col=vec3(.015,.013,.012);
    vec3 L=normalize(vec3(vSun,uSunZ));
    vec3 n=normalize(vec3(-(u+.06)*.8,-v*1.6,1.));
    col*=(.55+.85*max(dot(n,L),0.))*1.1;
    o=vec4(col,m*vB.w);return;
  }
  float cs=max(cos(th),.2);
  float x=abs(v)/cs;
  float le,ch,bl;
  if(ty<.5){le=.10+.08*min(x,.42)-.40*max(x-.42,0.);ch=mix(.23,.07,smoothstep(.3,1.,x));bl=.30;}
  else if(ty<1.5){le=.08-.18*x*x;ch=mix(.17,.04,smoothstep(.2,1.,x));bl=.34;}
  else{le=.06-.10*x*x;ch=mix(.15,.04,smoothstep(.35,1.,x));bl=.28;}
  float te=le-ch;
  float dw=max(max(te-u,u-le),(x-1.)*cs*.6);
  float db=sdEll(vec2(u-.02,v),vec2(bl,.07));
  float dh=length(vec2(u-bl*.95,v))-.062;
  float tu=-(u+bl*.8);
  float dt=ty<.5?max(max(tu-.16,-tu),abs(v)-(.05+tu*.25)):max(max(tu-.2,-tu),abs(v)-(.06-tu*.28));
  float dk=max(abs(v)-.018,max(u-(bl*.95+.13),(bl*.95+.03)-u));
  float dbody=min(min(db,dh),dt);
  float d=min(min(dw,dbody),dk);
  if(uShadow>.5){
    float s=aa+vSoft;
    float a=(1.-smoothstep(-s,s,d))*.3*vB.w;
    if(a<.002)discard;
    o=vec4(0.,0.,0.,a);return;
  }
  float m=1.-smoothstep(-aa,aa,d);
  if(m<.002)discard;
  bool wing=dw<min(dbody,dk);
  vec3 col;
  if(ty<.5){
    col=wing?mix(vec3(.56,.6,.66),vec3(.03),smoothstep(.72,.8,x)):vec3(.95);
    if(wing)col=mix(col,vec3(.82),smoothstep(.04,0.,u-te)*(1.-smoothstep(.7,.78,x)));
    if(dk<0.&&!wing&&dh>0.)col=vec3(.8,.62,.16);
  }else if(ty<1.5){
    col=wing?mix(vec3(.97),vec3(.03),smoothstep(.64,.72,x)):vec3(.97);
    if(dh<0.)col=vec3(.95,.8,.48);
    if(dk<0.&&dh>0.)col=vec3(.62,.64,.68);
  }else{
    col=wing?vec3(.14,.13,.12):vec3(.17,.16,.15);
  }
  float sg=v<0.?-1.:1.;
  vec3 n=wing?normalize(vec3(0.,-sg*sin(th),cos(th))):normalize(vec3(0.,v*5.,1.));
  vec3 L=normalize(vec3(vSun,uSunZ));
  col*=(.62+.9*max(dot(n,L),0.))*1.25;
  o=vec4(col,m*vB.w);
}`;

/* Fish: instanced quads in world space, drawn deepest-first into their own layer. Each fish writes its radiance
   as seen through the water above it, premultiplied, so the water shader can put it under the surface:
   water*(1-a)+rgb, then sky reflection, glare and foam on top. */
const FISH_VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 iA; /* x, y, heading, half-length (world) */
layout(location=1) in vec4 iB; /* spine bend, depth, species, alpha */
layout(location=2) in vec4 iC; /* flash, seed, half-width */
uniform vec2 uRes,uCam,uSunW;uniform float uRot,uZoom;
out vec2 vL;flat out vec4 vB;flat out vec4 vC;flat out float vPx;flat out float vCov;flat out vec2 vSun;
const vec2 Q[6]=vec2[6](vec2(-1,-1),vec2(1,-1),vec2(1,1),vec2(-1,-1),vec2(1,1),vec2(-1,1));
void main(){
  float px=iA.w/uZoom*uRes.y;
  /* a fish never draws smaller than ~1.4 px long; below that it grows and fades, keeping its share of light */
  float grow=max(1.,1.4/px);
  vec2 f=vec2(cos(iA.z),sin(iA.z)),r=vec2(-f.y,f.x);
  vec2 L=Q[gl_VertexID]*vec2(1.3,.62);
  vec2 w=iA.xy+(f*L.x+r*L.y)*iA.w*grow;
  vec2 d=(w-uCam)/uZoom;float c=cos(uRot),s=sin(uRot);
  vec2 sc=vec2(c*d.x-s*d.y,s*d.x+c*d.y);
  gl_Position=vec4(sc.x*2.*uRes.y/uRes.x,sc.y*2.,0.,1.);
  vL=L;vB=iB;vC=iC;vPx=1./(px*grow);vCov=1./(grow*grow);
  vSun=vec2(dot(uSunW,f),dot(uSunW,r));
}`;

const FISH_FS = `#version 300 es
precision highp float;
in vec2 vL;flat in vec4 vB;flat in vec4 vC;flat in float vPx;flat in float vCov;flat in vec2 vSun;
uniform vec3 uK,uVeil;uniform float uLight,uSunZ;
out vec4 o;
/* per species: dark back seen from above, lighter flank at the edges */
const vec3 BACK[5]=vec3[5](vec3(.025,.04,.07),vec3(.05,.1,.12),vec3(.06,.07,.065),vec3(.17,.2,.18),vec3(.16,.18,.19));
const vec3 FLANK[5]=vec3[5](vec3(.3,.36,.44),vec3(.55,.62,.66),vec3(.36,.38,.36),vec3(.62,.68,.64),vec3(.44,.46,.43));
void main(){
  float u=vL.x,v=vL.y,ty=vB.z;int k=int(ty+.5);
  float tt=max(1.-u,0.);
  v-=vB.x*tt*tt*.1; /* the spine curves most toward the tail */
  float av=abs(v),W=vC.z,aa=vPx*1.2;
  float bu=u>.2?(u-.2)/.8:(u-.2)/1.;
  float hw=W*sqrt(max(1.-bu*bu,0.));
  float dBody=max(av-hw,u-1.);
  /* the tail fin is vertical, so from above it's seen nearly edge-on: a narrow flare that the spine bend sweeps side
     to side. A wide fork reads as a dolphin's horizontal flukes. */
  float tw=(-.7-u)*.16+.02;
  float dFin=max(max(av-tw,-1.16-u),u+.7);
  float d=min(dBody,dFin*1.2);
  float m=1.-smoothstep(-aa,aa,d);
  if(m<.002)discard;
  float x=clamp(av/max(hw,1e-3),0.,1.);
  vec3 col=mix(BACK[k],FLANK[k],smoothstep(.35,1.,x));
  if(dBody>0.)col=BACK[k]*.85;
  vec3 n=normalize(vec3(-.35*(u-.2),v/max(hw,.03)*.9,1.));
  float sh=.4+.75*max(dot(n,normalize(vec3(vSun,uSunZ))),0.);
  /* a fish rolling into a turn shows the sun its silver side: a soft sheen across that half of the body, not a rim */
  float half_=smoothstep(-.2,.7,sign(vB.x+1e-4)*v/max(hw,.03));
  col=mix(col*uLight*sh,vec3(.8,.82,.84)*uLight,.55*vC.x*half_*step(dBody,0.));
  /* the fish hides whatever is behind it (sand, or deeper water); the water between it and the surface
     dims it, red first, and lays its own colour over it */
  vec3 T=exp(-uK*vB.y);
  float cov=m*vB.w*vCov*(k==3?.75:1.);
  o=vec4(cov*(T*col+(1.-T)*uVeil),cov);
}`;

const POST_COMMON = `#version 300 es
precision highp float;
uniform sampler2D uA,uB;uniform float uMix,uAspect;uniform vec2 uOut;
out vec4 fragColor;
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float gn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*f*(f*(f*6.-15.)+10.);
 #define G(o) (hash22(i+o)*2.-1.)
 return 2.*mix(mix(dot(G(vec2(0)),f),dot(G(vec2(1,0)),f-vec2(1,0)),u.x),mix(dot(G(vec2(0,1)),f-vec2(0,1)),dot(G(vec2(1)),f-vec2(1)),u.x),u.y);}
float dissolve(vec2 uv,float m){
  vec2 q=uv*vec2(uAspect,1.);
  float n=.5+.32*gn(q*2.2+7.)+.12*gn(q*7.+3.);
  return smoothstep(n-.22,n+.22,m*1.5-.25);
}
vec3 sceneAt(vec2 uv){
  vec3 a=texture(uA,uv).rgb;
  if(uMix<=0.)return a;
  return mix(a,texture(uB,uv).rgb,dissolve(uv,uMix));
}`;

const PREFILTER = POST_COMMON + `
uniform vec2 uTexel;uniform float uThr,uRaw;
void main(){
  vec2 uv=gl_FragCoord.xy/uOut;
  vec3 c=(sceneAt(uv+uTexel*vec2(-1,-1))+sceneAt(uv+uTexel*vec2(1,-1))+sceneAt(uv+uTexel*vec2(-1,1))+sceneAt(uv+uTexel*vec2(1,1)))*.25;
  if(uRaw>.5){fragColor=vec4(c,1);return;}
  float br=max(c.r,max(c.g,c.b));
  float k=max(br-uThr,0.);k=k*k/(k+.5);
  fragColor=vec4(c*k/max(br,1e-4),1);
}`;

const DOWN = `#version 300 es
precision highp float;uniform sampler2D uSrc;uniform vec2 uTexel,uOut;out vec4 fragColor;
void main(){vec2 uv=gl_FragCoord.xy/uOut;
fragColor=(texture(uSrc,uv+uTexel*vec2(-1,-1))+texture(uSrc,uv+uTexel*vec2(1,-1))+texture(uSrc,uv+uTexel*vec2(-1,1))+texture(uSrc,uv+uTexel*vec2(1,1)))*.25;}`;

const BLUR = `#version 300 es
precision highp float;uniform sampler2D uSrc;uniform vec2 uDir,uOut;out vec4 fragColor;
void main(){vec2 uv=gl_FragCoord.xy/uOut;
vec4 c=texture(uSrc,uv)*.2270270270;
c+=(texture(uSrc,uv+uDir*1.3846153846)+texture(uSrc,uv-uDir*1.3846153846))*.3162162162;
c+=(texture(uSrc,uv+uDir*3.2307692308)+texture(uSrc,uv-uDir*3.2307692308))*.0702702703;

const POST = POST_COMMON + `
uniform sampler2D uB4,uB8,uM8,uM16;uniform float uExposure,uTime,uFade,uBloom,uTilt,uGlow;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){
  vec2 uv=gl_FragCoord.xy/uOut;
  vec2 dc=uv-.5;vec2 da=dc*vec2(uAspect,1.);float r2=dot(da,da);
  /* chromatic aberration grows with r³, measured in screen heights; past a 16:9 corner (r≈1.02) it stops growing,
     so ultrawide edges get no more fringing than a normal screen's corners */
  float rl=length(da),re=min(rl,1.05);
  vec2 ca=da/max(rl,1e-4)*re*re*re/vec2(uAspect,1.)*.013*(1.-.5*min(uTilt,1.));
  vec3 c;
  float amt=smoothstep(.18,.46,abs(uv.y-.52))*uTilt;
  if(amt>.003){
    vec2 rad=vec2(1./uAspect,1.)*.016*amt;
    vec3 acc=sceneAt(uv);float ws=1.;
    for(int i=1;i<28;i++){float fi=float(i);float r=sqrt(fi/28.);float a=fi*2.39996;
      vec3 s=sceneAt(uv+vec2(cos(a),sin(a))*r*rad);float w=1.+max(max(s.r,s.g),s.b)*.6;acc+=s*w;ws+=w;}
    c=acc/ws;
  }else{
    vec3 s0=sceneAt(uv-ca),s1=sceneAt(uv-ca*.5),s2=sceneAt(uv),s3=sceneAt(uv+ca*.5),s4=sceneAt(uv+ca);
    c=vec3(s0.r*.6+s1.r*.4,s2.g*.6+(s1.g+s3.g)*.2,s4.b*.6+s3.b*.4);
  }
  c+=(texture(uB4,uv).rgb*.5+texture(uB8,uv).rgb*.8)*uBloom;
  vec3 mist=texture(uM8,uv).rgb*.45+texture(uM16,uv).rgb*.55;
  c=mix(c,max(c,mist),.28*uGlow)+mist*.15*uGlow;
  float lum=dot(c,vec3(.2126,.7152,.0722));
  c=max(mix(vec3(lum),c,1.+.26*min(uTilt,1.5)),0.);
  c=aces(c*uExposure);
  c*=1.-.34*smoothstep(.12,1.,r2);
  c=pow(c,vec3(1./2.2));
  float g=hash12(gl_FragCoord.xy+fract(uTime*7.13)*517.)-.5;
  c+=g*.024*(1.-c*.55);
  fragColor=vec4(c*uFade,1);
}`;

const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const lerp = (a, b, t) => a + (b - a) * t;
const lerp3 = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
const norm3 = v => { const l = Math.hypot(...v); return v.map(x => x / l); };

const NEB_PAL = [

  { name: "Eagle",   a: [1.0, 0.84, 0.55], b: [0.62, 0.29, 0.13], c: [0.1, 0.32, 0.55] },
  { name: "Veil",    a: [0.62, 0.9, 1.0],  b: [0.2, 0.3, 1.0],   c: [0.85, 0.2, 0.55] },
  { name: "Lagoon",  a: [1.0, 0.88, 0.6],  b: [0.1, 0.6, 0.55],  c: [0.85, 0.18, 0.22] },

const CLOUD_MORPH = (() => {
  const v = parseFloat(new URLSearchParams(location.search).get("morph"));
  return v > 0 && v <= 5 ? v : 0.25;
})();
function oceanSky(rnd, mode) {
  const golden = rnd() < 0.35;
  const az = rnd() * Math.PI * 2, el = golden ? lerp(0.42, 0.55, rnd()) : lerp(0.62, 0.82, rnd());
  const wa = rnd() * Math.PI * 2, ws = lerp(0.006, 0.01, rnd()) * (mode ? 0.45 : 1);
  return {
    uniforms: {
      uMode: mode, uWaveScale: 14.3, uWindAng: rnd() * 6.2832,
      /* cloud shape-change rate per unit of scene time. Open Water's shadows keep the original slow rate; Cloudline's clouds visibly evolve (?morph= overrides it for tuning) */
      uMorph: mode ? 0.02025 : CLOUD_MORPH,
      uSun: norm3([Math.cos(az) * Math.cos(el), Math.sin(az) * Math.cos(el), Math.sin(el)]),
      uSunCol: golden ? [1.9, 1.4, 0.95] : [1.75, 1.66, 1.52],
      uSky: golden ? [0.42, 0.44, 0.56] : [0.36, 0.52, 0.8],
      uDeep: lerp3([0.004, 0.03, 0.065], [0.004, 0.055, 0.08], rnd()),
      uScatter: [0.02, 0.2, 0.22],
      uCover: mode ? lerp(-0.2, -0.08, rnd()) : lerp(-0.33, -0.24, rnd()),
      uWind: [Math.cos(wa) * ws, Math.sin(wa) * ws],
    },
    sub: mode
      ? `Open ocean · shadows of high cloud passing overhead · ${golden ? "late afternoon" : "midday"}`
      : `Fair-weather cumulus over open ocean · ${golden ? "late afternoon" : "midday"} · ≈ 1,800 m`,
  };
}

    if (state.tourFav && favs.length > 1 && pool.length) loadFav(pool[Math.floor(Math.random() * pool.length)]);

/* Keep the frame rate near 60 fps by trading internal resolution. The goal is absolute: judging frames against the

const capEl = document.getElementById("caption");

let idleTimer = 0, hoveringDock = false;
const dock = document.getElementById("dock");

function poke() {

const btnPlay = document.getElementById("btnPlay"), icoPlay = document.getElementById("icoPlay");

const speed = document.getElementById("speed"), speedOut = document.getElementById("speedOut");

setSpeed(state.speed);

const btnTour = document.getElementById("btnTour");
function setTour(v) { state.tour = v; btnTour.setAttribute("aria-pressed", String(v)); if (v) lastSwitch = performance.now(); try { localStorage.setItem("driftglass-tour", v ? "1" : "0"); } catch (e) {} }

const btnTilt = document.getElementById("btnTilt");

setTiltLevel(state.tiltLevel);
btnTilt.addEventListener("click", () => setTilt(!state.tilt));
setTilt(state.tilt);
tiltAmt = state.tilt ? 1 : 0;
const btnGlow = document.getElementById("btnGlow");
function setGlow(v) { state.glow = v; btnGlow.setAttribute("aria-pressed", String(v)); try { localStorage.setItem("driftglass-glow", v ? "1" : "0"); } catch (e) {} }
btnGlow.addEventListener("click", () => setGlow(!state.glow));
setGlow(state.glow);
glowAmt = state.glow ? 1 : 0;

/* Favorites */
let favs = [];
try { favs = JSON.parse(localStorage.getItem("driftglass-favs") || "[]") || []; } catch (e) { favs = []; }
const saveFavs = () => { try { localStorage.setItem("driftglass-favs", JSON.stringify(favs)); } catch (e) {} };
const btnFav = document.getElementById("btnFav");
const activeInst = () => pending || next || cur;
const favIndex = inst => inst ? favs.findIndex(x => x.scene === inst.scene.id && x.seed === inst.seed) : -1;
function updateHeart() {
  const on = favIndex(activeInst()) >= 0;
  btnFav.setAttribute("aria-pressed", String(on));
  btnFav.setAttribute("aria-label", on ? "Remove from favorites" : "Save to favorites");
  btnFav.title = on ? "Remove from favorites (S)" : "Save to favorites (S)";
  renderFavs();
}
function toggleFav() {
  const inst = activeInst(); if (!inst) return;
  const i = favIndex(inst);
  if (i >= 0) favs.splice(i, 1);
  else {
    favs.unshift({ scene: inst.scene.id, seed: inst.seed, t: Math.round(inst.t * 10) / 10, speed: state.speed, tilt: state.tilt, tiltLevel: state.tiltLevel, glow: state.glow, sub: inst.sub, at: Date.now() });
    if (favs.length > 60) favs.length = 60;

  }

}

  const idx = SCENES.findIndex(s => s.id === fv.scene); if (idx < 0) return;
  if (typeof fv.speed === "number") setSpeed(fv.speed);
  if (typeof fv.tilt === "boolean") setTilt(fv.tilt);
  if (typeof fv.tiltLevel === "number") setTiltLevel(fv.tiltLevel);
  if (typeof fv.glow === "boolean") setGlow(fv.glow);

const SWATCH = {

  clouds: "radial-gradient(circle at 60% 40%, #f4f1ea 22%, #12405c 55%, #07243a)",
  sea: "linear-gradient(150deg, #1d5a6e, #0a2a3d 60%, #06192a)",
  shore: "linear-gradient(160deg, #d9c8a4 45%, #eef2f0 50%, #2bb3b0 58%, #0b5c73)",

    const sc = SCENES.find(s => s.id === fv.scene); if (!sc) return;
    const li = document.createElement("li"); li.className = "fav" + (a && a.scene.id === fv.scene && a.seed === fv.seed ? " on" : "");
    const go_ = document.createElement("button"); go_.type = "button"; go_.className = "fav-go";
    go_.innerHTML = `<span class="fav-sw" style="background:${SWATCH[fv.scene] || "#222"}"></span><span class="fav-txt"><span class="fav-name"></span><span class="fav-meta"></span></span>`;
    go_.querySelector(".fav-name").textContent = sc.title;
    go_.querySelector(".fav-meta").textContent = `Variation ${String(fv.seed).padStart(4, "0")} · ${Number(fv.speed || 0.5).toFixed(1)}×${fv.tilt ? " · tilt" : ""}`;

    x.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';

btnFav.addEventListener("click", () => { toggleFav(); poke(); });

/* Panels */
let openPanel = null;
function placePanel(el) {
  const top = dock.getBoundingClientRect().top;
  el.style.bottom = Math.max(16, window.innerHeight - top + 10) + "px";
}
function togglePanel(id, btn) {
  const el = document.getElementById(id);
  const wasOpen = openPanel === el;
  closePanels();
  if (wasOpen) return;
  el.hidden = false; placePanel(el); openPanel = el; btn.setAttribute("aria-expanded", "true");
  if (id === "favPanel") renderFavs();

}

}
document.getElementById("btnFavs").addEventListener("click", () => togglePanel("favPanel", document.getElementById("btnFavs")));
document.getElementById("btnSet").addEventListener("click", () => togglePanel("setPanel", document.getElementById("btnSet")));

document.querySelectorAll(".panel").forEach(p => {

});

/* Sound controls */
const btnSound = document.getElementById("btnSound"), btnSound2 = document.getElementById("btnSound2");
let soundPref = false, soundVol = 0.7;
try { soundPref = localStorage.getItem("driftglass-sound") === "1"; const v = parseFloat(localStorage.getItem("driftglass-vol")); if (v >= 0 && v <= 1) soundVol = v; } catch (e) {}
function paintSound(v) {
  [btnSound, btnSound2].forEach(b => b.setAttribute("aria-pressed", String(v)));
  document.getElementById("icoSound").querySelectorAll("path").forEach((p, i) => { if (i) p.setAttribute("opacity", v ? "1" : ".35"); });
  btnSound.title = v ? "Mute (M)" : "Sound (M)";
}
function setSound(v) {
  soundPref = v;
  try { localStorage.setItem("driftglass-sound", v ? "1" : "0"); } catch (e) {}
  if (v) { if (!Sound.start()) { soundPref = false; } } else Sound.stop();
  paintSound(soundPref);
}

btnSound2.addEventListener("click", () => setSound(!Sound.on));
const volEl = document.getElementById("vol");
function setVol(v) { soundVol = v; volEl.value = v; document.getElementById("volOut").textContent = Math.round(v * 100); Sound.setVolume(v); try { localStorage.setItem("driftglass-vol", String(v)); } catch (e) {} }

  const kick = () => { window.removeEventListener("pointerdown", kick, true); window.removeEventListener("keydown", kick, true); if (!Sound.on) setSound(true); };
  window.addEventListener("pointerdown", kick, true); window.addEventListener("keydown", kick, true);
}

btnFish.addEventListener("click", () => setFish(!state.fish));
setFish(state.fish);
const btnTourFav = document.getElementById("btnTourFav");

try { state.tourFav = localStorage.getItem("driftglass-tourfav") === "1"; } catch (e) {}

btnTourFav.addEventListener("click", () => setTourFav(!state.tourFav));
setTourFav(state.tourFav);
renderFavs();



document.getElementById("btnSeed").addEventListener("click", () => go(SCENES.indexOf(active())));
document.getElementById("btnFull").addEventListener("click", toggleFull);
function toggleFull() {
  try {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  } catch (e) {}
}

window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && (e.target.type === "text" || e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
  const idx = SCENES.indexOf(active());
  let used = true;
  switch (e.key) {
    case "ArrowRight": go((idx + 1) % SCENES.length); break;
    case "ArrowLeft": go((idx + SCENES.length - 1) % SCENES.length); break;
    case " ": setPaused(!state.paused); break;
    case "n": case "N": go(idx); break;
    case "f": case "F": toggleFull(); break;
    case "t": case "T": setTour(!state.tour); break;
    case "b": case "B": setTilt(!state.tilt); break;
    case "g": case "G": setGlow(!state.glow); break;
    case "m": case "M": setSound(!Sound.on); break;
    case "s": case "S": toggleFav(); break;
    case "l": case "L": togglePanel("favPanel", document.getElementById("btnFavs")); break;
    case "Escape": closePanels(); break;
    case "h": case "H": clearTimeout(idleTimer); body.classList.add("idle"); return e.preventDefault();
    default: used = false;
  }
  if (used) { e.preventDefault(); wake(); }
  poke();
});

let lock = null;
function wake() {
  if (lock || !navigator.wakeLock) return;
  navigator.wakeLock.request("screen").then(l => { lock = l; l.addEventListener("release", () => { lock = null; }); }).catch(() => {});
}
document.addEventListener("visibilitychange", () => { Sound.suspend(document.hidden); if (!document.hidden) { last = performance.now(); acc = []; wake(); } });

/* A lost context (usually a GPU driver reset) leaves every program, buffer and target dead. Rebuilding in place would
   mean threading teardown through the whole renderer; reloading into safe mode is simpler, and asking first avoids a
   reset → reload → reset loop. */
canvas.addEventListener("webglcontextlost", e => {
  e.preventDefault();
  lost = true;

  try { sessionStorage.setItem("driftglass-safe", "1"); } catch (err) {}
  body.insertAdjacentHTML("beforeend", '<div class="fail"><p>The graphics driver reset.<br><button type="button" class="restart">Restart at lower quality</button></p></div>');
  body.querySelector(".fail .restart").addEventListener("click", () => location.reload());
});

window.addEventListener("resize", resize);
resize();
scale = Math.min(scale, safeStart ? 0.3 : Math.sqrt(START_PIXELS / (W * H))); allocate();
fastClimbUntil = performance.now() + 15000; /* climb in 0.8 s steps while the opening budget finds its level */

const hashId = location.hash.replace("#", "");
const startIdx = Math.max(0, SCENES.findIndex(s => s.id === hashId));
go(hashId ? startIdx : SCENES.findIndex(s => s.id === "shore")); /* opens on the shoreline unless the URL names a scene */
lastSwitch = performance.now();
poke();
setTimeout(() => { if (!hoveringDock) body.classList.add("idle"); }, 5000);
requestAnimationFrame(frame);
})();
