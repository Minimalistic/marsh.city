<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particul8</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  particul-8 { display: block; width: 100%; height: 100%; }
</style>
<script type="module" src="./embed.js"></script>
</head>
<body>
<!-- Chromeless frame for iframe embeds: /particul8/embed.html#p8=<share payload> -->
<particul-8 id="p8"></particul-8>
<script type="module">
  const apply = () => {
    const m = /p8=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (m) document.getElementById('p8').setAttribute('config', m[1]);
  };
  apply();
  addEventListener('hashchange', apply);
</script>
</body>
</html>
